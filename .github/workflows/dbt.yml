name: dbt CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DBT_PROFILES_DIR: ~/.dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.8.7" "dbt-duckdb==1.8.4"

      - name: Check dbt version
        run: dbt --version

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<'EOF'
          retail_loyalty_dbt:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: retail_loyalty.duckdb
                threads: 4
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Seed raw data
        run: dbt seed --full-refresh

      - name: Parse dbt project
        run: dbt parse

      - name: Build dbt models
        run: dbt run

      - name: Run dbt tests
        run: dbt test

      - name: Generate dbt docs
        run: dbt docs generate